[project]
name = "ai-architect-backend"
version = "0.1.0"
description = "Google ADK agents for the ai-architect project."
requires-python = ">=3.10"
dependencies = [
    "google-adk==2.11.0",
    # LiteLLM powers the OpenRouter connector; >=1.84 is what ADK requires and
    # it avoids the compromised 1.82.7 / 1.82.8 releases.
    "litellm>=1.84,<2",
    "python-dotenv>=1,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
